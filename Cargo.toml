[workspace]
members = ["crates/engine", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.3.2" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.3.2", features = ["client"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
